services:
  xerovolt-web:
    build:
      context: .
      args:
        # Baked into the client bundle at build time — must be the public Supabase
        # Cloud project URL (see Dockerfile comment).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: xerovolt-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # loopback-only — Caddy is the public entry point
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      PHONEPE_ENVIRONMENT: ${PHONEPE_ENVIRONMENT}
      PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID}
      PHONEPE_SALT_KEY: ${PHONEPE_SALT_KEY}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX}
      PHONEPE_CALLBACK_URL: ${PHONEPE_CALLBACK_URL}
    networks:
      # This app talks to Supabase Cloud (public internet), not the self-hosted
      # instance — it only needs to be on this network so Caddy (also on it) can
      # reach it by container name at xerovolt-web:3000.
      - supabase_default

networks:
  supabase_default:
    external: true
